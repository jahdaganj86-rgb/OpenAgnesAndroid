name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          SDK_DIR=$HOME/android-sdk
          mkdir -p "$SDK_DIR/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_DIR/cmdline-tools/"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Create Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TAG="v${{ github.run_id }}"
          REPO="${{ github.repository }}"
          for attempt in 1 2 3 4 5; do
            if gh release create "$TAG" \
              --repo "$REPO" \
              --title "Open Agnes Debug APK" \
              --notes "Debug build from run ${{ github.run_id }}"; then
              break
            fi
            echo "gh release create failed (attempt $attempt); retrying in 10s..."
            sleep 10
          done
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" \
              app/build/outputs/apk/debug/app-debug.apk \
              --repo "$REPO" \
              --clobber; then
              break
            fi
            echo "gh release upload failed (attempt $attempt); retrying in 10s..."
            sleep 10
          done
